[project]
name = "mewhelp-agent"
version = "0.1.0"
description = "E-commerce AI customer service agent (intent routing + hybrid RAG + Workflow/Agent orchestration)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pymilvus>=2.5,<2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
