<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MewHelp 链路可视化</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
    button { padding: 6px 12px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: left; font-size: 14px; }
    th { background: #f6f8fa; }
    .muted { color: #6b7280; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>MewHelp 调用链</h1>
  <p class="muted">每次对话会生成一个 request_id，按节点记录耗时。点下面的按钮看详情。</p>

  <div class="row">
    <button onclick="loadRecent()">刷新最近链路</button>
    <span id="hint" class="muted"></span>
  </div>

  <div id="list" class="row"></div>
  <div id="detail"></div>

  <script>
    async function loadRecent() {
      document.getElementById("hint").textContent = "加载中…";
      const r = await fetch("/trace/recent");
      const items = await r.json();
      const box = document.getElementById("list");
      box.innerHTML = "";
      if (!items.length) { document.getElementById("hint").textContent = "还没有记录，先去对话几次"; return; }
      document.getElementById("hint").textContent = "";
      for (const it of items) {
        const btn = document.createElement("button");
        btn.textContent = it.request_id.slice(0, 8) + "（" + it.nodes + " span）";
        btn.onclick = () => loadDetail(it.request_id);
        box.appendChild(btn);
      }
    }

    async function loadDetail(requestId) {
      const r = await fetch("/trace/" + requestId);
      const data = await r.json();
      let html = "<p>request_id: <code>" + data.request_id + "</code></p>";
      html += "<table><tr><th>节点</th><th>工具</th><th>耗时(ms)</th><th>错误</th><th>时间</th></tr>";
      for (const s of data.spans) {
        html += "<tr><td>" + (s.node || "-") + "</td><td>" + (s.tool || "-") + "</td><td>"
              + (s.latency_ms ?? "-") + "</td><td>" + (s.error || "-") + "</td><td class='muted'>"
              + (s.time || "-") + "</td></tr>";
      }
      html += "</table>";
      document.getElementById("detail").innerHTML = html;
    }

    loadRecent();
  </script>
</body>
</html>
